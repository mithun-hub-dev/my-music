<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🎵 Mithun's Music</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    margin:0;
}


/* Main layout */

.container{

display:flex;
gap:30px;
padding:20px;

}


/* Left playlist */

.playlist{

width:65%;

}


h1{

text-align:center;

}


.song{

    position:relative;
    background-size:cover;
    background-position:center;
    margin:15px 0;
    padding:20px;
    border-radius:15px;
    overflow:hidden;

}


.song::before{

content:"";
position:absolute;
inset:0;
background:linear-gradient(
rgba(0,0,0,0.75),
rgba(0,0,0,0.75)
);

}


.song h3,
.song .movie,
.song audio{

    position:relative;
    z-index:1;

}


.movie{

    color:#ddd;
    font-size:14px;
    margin-bottom:10px;

}

audio{

width:100%;

}


/* Right control panel */

.controls{

width:30%;
background:#222;
border-radius:15px;
padding:20px;
height:200px;
text-align:center;

}


button{

background:#4db8ff;
border:none;
padding:12px 18px;
margin:10px;
border-radius:8px;
font-size:18px;
cursor:pointer;

}


button:hover{

background:white;
color:black;

}



/* Mobile view */

@media(max-width:700px){

.container{

display:block;

}


.playlist,
.controls{

width:100%;

}


.controls{

margin-top:20px;

}

}


</style>

</head>


<body>


<div class="container">


<!-- LEFT SIDE SONG LIST -->

<div class="playlist">


<h1>🎵 Mithun's Playlist</h1>


<div class="song" style="background-image:url('images/Thirumanam_ennum_nikkah.jpg');">

<h3>Enthara Enthara</h3>

<div class="movie">
Movie: Thirumanam Enum Nikkah
</div>

<audio controls>
<source src="Enthara-Enthara.mp3" type="audio/mpeg">
</audio>

</div>



<div class="song" style="background-image:url('images/Majunu.jpg');">

<h3>Gulmohar Malare</h3>

<div class="movie">
Movie: Majunu
</div>

<audio controls>
<source src="Gulmohar-Malare.mp3" type="audio/mpeg">
</audio>

</div>




<div class="song" style="background-image:url('images/Amaran_2024.jpg');">

<h3>Hey Minnale</h3>

<div class="movie">
Movie: Amaran
</div>

<audio controls>
<source src="Hey Minnale.mp3" type="audio/mpeg">
</audio>

</div>



<div class="song" style="background-image:url('images/Amaran_2024.jpg');">

<h3>Kanave</h3>

<div class="movie">
Movie: Amaran
</div>

<audio controls>
<source src="Kanave.mp3" type="audio/mpeg">
</audio>

</div>



<div class="song" style="background-image:url('images/Pugazh.jpg');">

<h3>Neeyae</h3>

<div class="movie">
Movie: Pugazh
</div>

<audio controls>
<source src="Neeyae.mp3" type="audio/mpeg">
</audio>

</div>



<div class="song" style="background-image:url('images/Amaran_2024.jpg');">

<h3>Uyire</h3>

<div class="movie">
Movie: Amaran
</div>

<audio controls>
<source src="Uyirey.mp3" type="audio/mpeg">
</audio>

</div>



<div class="song" style="background-image:url('images/Amaran_2024.jpg');">

<h3>Vaane Vaane</h3>

<div class="movie">
Movie: Amaran
</div>

<audio controls>
<source src="Vaane Vaane.mp3" type="audio/mpeg">
</audio>

</div>



<div class="song" style="background-image:url('images/Amaran_2024.jpg');">

<h3>Vennilavu Saaral</h3>

<div class="movie">
Movie: Amaran
</div>

<audio controls>
<source src="Vennilavu Saaral.mp3" type="audio/mpeg">
</audio>

</div>


</div>



<!-- RIGHT SIDE PLAYER -->

<div class="controls">

<h2>🎧 Player</h2>

<button onclick="previousSong()">⏮</button>

<button onclick="playPauseSong()" id="playPauseBtn">▶️</button>

<button onclick="nextSong()">⏭</button>


<p id="status">
Select a song
</p>


</div>



</div>



<script>


let songs = document.querySelectorAll("audio");

let current = 0;

let isPlaying = false;


let songNames = [

"Enthara Enthara",
"Gulmohar Malare",
"Hey Minnale",
"Kanave",
"Neeyae",
"Uyire",
"Vaane Vaane",
"Vennilavu Saaral"

];



// Detect when user clicks any audio player

songs.forEach((song,index)=>{


song.addEventListener("play",function(){


songs.forEach((other,i)=>{

if(i !== index){

other.pause();

}

});


current=index;

isPlaying=true;


document.getElementById("playPauseBtn").innerHTML="⏸";


document.getElementById("status").innerHTML=
"Now Playing: "+songNames[index];


});


});





function playSong(index){


songs.forEach(song=>{

song.pause();

song.currentTime=0;

});


songs[index].play();


current=index;


isPlaying=true;


document.getElementById("playPauseBtn").innerHTML="⏸";


document.getElementById("status").innerHTML=
"Now Playing: "+songNames[index];


}





function nextSong(){


current++;


if(current >= songs.length){

current=0;

}


playSong(current);


}





function previousSong(){


current--;


if(current < 0){

current=songs.length-1;

}


playSong(current);


}





function playPauseSong(){



if(!songs[current]){

return;

}



if(isPlaying){


songs[current].pause();


isPlaying=false;


document.getElementById("playPauseBtn").innerHTML="▶️";


document.getElementById("status").innerHTML=
"Paused: "+songNames[current];


}

else{


songs[current].play();


isPlaying=true;


document.getElementById("playPauseBtn").innerHTML="⏸";


document.getElementById("status").innerHTML=
"Now Playing: "+songNames[current];


}


}
    
</script>


</body>
</html>
