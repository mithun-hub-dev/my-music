<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mithun Music</title>


<style>

body{

margin:0;
font-family:Arial, sans-serif;
background:#111;
color:white;

}


header{

text-align:center;
padding:25px;
background:#1db954;

}


header h1{

margin:0;
font-size:30px;

}


.container{

padding:20px;
max-width:700px;
margin:auto;

}



.song{

background:#222;
margin:12px 0;
padding:15px;

border-radius:10px;

display:flex;

justify-content:space-between;

align-items:center;

}



.song button{

background:#1db954;

border:none;

color:white;

padding:10px 18px;

border-radius:20px;

cursor:pointer;

}



.song button:hover{

background:#16a34a;

}



.player{

position:fixed;

bottom:0;

left:0;

width:100%;

background:#222;

padding:15px;

text-align:center;

}



#current{

font-size:16px;

margin-bottom:10px;

}



.controls button{

background:white;

border:none;

border-radius:50%;

width:40px;

height:40px;

margin:5px;

cursor:pointer;

font-size:18px;

}



audio{

width:90%;

}



@media(max-width:600px){


.song{

font-size:14px;

}


}


</style>


</head>



<body>


<header>

<h1>🎵 Mithun Music</h1>

<p>My Personal Playlist</p>

</header>



<div class="container">



<div class="song">

<span>Enthara Enthara</span>

<button onclick="playSong(0)">Play</button>

</div>



<div class="song">

<span>Gulmohar Malare</span>

<button onclick="playSong(1)">Play</button>

</div>



<div class="song">

<span>Hey Minnale</span>

<button onclick="playSong(2)">Play</button>

</div>



<div class="song">

<span>Kanave</span>

<button onclick="playSong(3)">Play</button>

</div>



<div class="song">

<span>Neeyae</span>

<button onclick="playSong(4)">Play</button>

</div>



<div class="song">

<span>Uyirey</span>

<button onclick="playSong(5)">Play</button>

</div>



<div class="song">

<span>Vaane Vaane</span>

<button onclick="playSong(6)">Play</button>

</div>



<div class="song">

<span>Vennilavu Saaral</span>

<button onclick="playSong(7)">Play</button>

</div>



</div>




<div class="player">


<div id="current">

Select a song

</div>



<div class="controls">


<button onclick="previous()">⏮</button>

<button onclick="playPause()">⏯</button>

<button onclick="next()">⏭</button>


</div>



<audio id="audio" controls></audio>


</div>





<script>


let songs=[

"Enthara-Enthara.mp3",

"Gulmohar-Malare.mp3",

"Hey Minnale.mp3",

"Kanave.mp3",

"Neeyae.mp3",

"Uyirey.mp3",

"Vaane Vaane.mp3",

"Vennilavu Saaral.mp3"

];



let currentSong=0;


let audio=document.getElementById("audio");

let title=document.getElementById("current");



function playSong(index){


currentSong=index;


audio.src=songs[index];

audio.play();


title.innerHTML="Playing : "+songs[index];


}



function playPause(){


if(audio.paused)

audio.play();

else

audio.pause();


}



function next(){


currentSong++;


if(currentSong>=songs.length)

currentSong=0;


playSong(currentSong);


}




function previous(){


currentSong--;


if(currentSong<0)

currentSong=songs.length-1;


playSong(currentSong);


}



</script>


</body>

</html>
