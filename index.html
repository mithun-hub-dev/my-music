<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎧 Mithun's Music</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h1 class="logo">
            🎧 Mithun's Music
        </h1>

        <p class="tagline">
            Your Personal Tamil Music Collection
        </p>

        <nav>

<button class="menu active" id="homeMenu">
    🏠 Home
</button>

<button class="menu" id="playlistMenu">
    🎵 Playlist
</button>

<button class="menu" id="favoritesMenu">
    ❤️ Favorites
</button>

<button class="menu" id="recentMenu">
    🕘 Recently Played
</button>

</nav>

    </aside>



    <!-- Main Section -->

    <main class="main">

        <!-- Search -->

        <div class="topbar">

            <input
                type="text"
                id="search"
                placeholder="Search songs...">

        </div>





        <!-- Playlist -->

        <section>

            <h2 class="section-title">
                My Playlist
            </h2>

            <div id="playlist">

                <!-- Songs will come from JavaScript -->

            </div>

        </section>

    </main>







    <!-- Music Player -->

    <aside class="player">

        <img
            id="cover"
            src="images/Thirumanam_ennum_nikkah.jpg"
            alt="Album Cover">

        <h2 id="title">
            Select a Song
        </h2>

        <p id="artist">
            Tamil OST
        </p>

        <p id="movie">
            Movie
        </p>





        <!-- Progress -->

        <input
            type="range"
            id="progress"
            value="0"
            min="0"
            max="100">

        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>







        <!-- Controls -->

        <div class="controls">

            <button id="shuffle">
                🔀
            </button>

            <button id="previous">
                ⏮
            </button>

            <button id="play">
                ▶️
            </button>

            <button id="next">
                ⏭
            </button>

            <button id="repeat">
                🔁
            </button>

        </div>







        <!-- Volume -->

        <div class="volume-box">

            🔊

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1">

        </div>

    </aside>

</div>







<audio id="audio" preload="metadata"></audio>

<script src="songs.js"></script>

<script src="script.js"></script>

</body>
</html>
