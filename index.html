<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mithun Music</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{

background:#000;
color:white;

}



/* SIDE MENU */


.sidebar{

position:fixed;
width:230px;
height:100vh;
background:#050505;
padding:25px;

}



.logo{

font-size:28px;
font-weight:bold;
color:#1ed760;

margin-bottom:40px;

}


.menu{

font-size:17px;
margin:20px 0;

color:#bbb;

}



/* MAIN */


.main{

margin-left:230px;
padding:30px;

background:
linear-gradient(#222,#000);

min-height:100vh;

}



.title{

font-size:32px;
margin-bottom:30px;

}



/* SONG GRID */


.music-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:25px;

}



.card{

background:#181818;

padding:20px;

border-radius:12px;

transition:.3s;

}



.card:hover{

background:#282828;
transform:translateY(-5px);

}



.cover{

height:180px;

border-radius:10px;

background:
linear-gradient(135deg,#1db954,#191414);

display:flex;

align-items:center;

justify-content:center;

font-size:70px;

margin-bottom:15px;

}



.card h3{

font-size:18px;

margin-bottom:15px;

}



.play{

background:#1ed760;

border:none;

height:45px;
width:45px;

border-radius:50%;

font-size:20px;

cursor:pointer;

float:right;

}




/* PLAYER */


.player{

position:fixed;

bottom:0;

left:0;

width:100%;

height:90px;

background:#181818;

display:flex;

align-items:center;

padding:15px 30px;

gap:20px;

}



.song-name{

width:200px;

}



.controls button{

background:none;

border:none;

color:white;

font-size:25px;

cursor:pointer;

}



audio{

flex:1;

}




/* MOBILE */


@media(max-width:700px){


.sidebar{

display:none;

}


.main{

margin:0;

padding:20px;

}



.music-grid{

grid-template-columns:
repeat(2,1fr);

}



.card{

padding:12px;

}



.cover{

height:120px;

}



.player{

height:110px;

padding:10px;

display:block;

text-align:center;

}



.song-name{

width:auto;

margin-bottom:5px;

}


audio{

width:100%;

}


}



</style>

</head>



<body>



<div class="sidebar">


<div class="logo">
🎵 Mithun Music
</div>


<div class="menu">
🏠 Home
</div>


<div class="menu">
🎧 My Playlist
</div>


<div class="menu">
❤️ Favorites
</div>


</div>





<div class="main">


<h1 class="title">
Good Evening 🎶
</h1>



<div class="music-grid">



<div class="card">

<div class="cover">
🎵
</div>

<h3>Enthara Enthara</h3>

<button class="play"
onclick="playSong(0)">
▶
</button>

</div>





<div class="card">

<div class="cover">
🎵
</div>

<h3>Gulmohar Malare</h3>

<button class="play"
onclick="playSong(1)">
▶
</button>

</div>





<div class="card">

<div class="cover">
🎵
</div>

<h3>Hey Minnale</h3>

<button class="play"
onclick="playSong(2)">
▶
</button>

</div>





<div class="card">

<div class="cover">
🎵
</div>

<h3>Kanave</h3>

<button class="play"
onclick="playSong(3)">
▶
</button>

</div>





<div class="card">

<div class="cover">
🎵
</div>

<h3>Neeyae</h3>

<button class="play"
onclick="playSong(4)">
▶
</button>

</div>





<div class="card">

<div class="cover">
🎵
</div>

<h3>Uyirey</h3>

<button class="play"
onclick="playSong(5)">
▶
</button>

</div>





<div class="card">

<div class="cover">
🎵
</div>

<h3>Vaane Vaane</h3>

<button class="play"
onclick="playSong(6)">
▶
</button>

</div>





<div class="card">

<div class="cover">
🎵
</div>

<h3>Vennilavu Saaral</h3>

<button class="play"
onclick="playSong(7)">
▶
</button>

</div>



</div>


</div>





<div class="player">


<div class="song-name" id="now">
No Song Selected
</div>


<div class="controls">

<button onclick="previous()">
⏮
</button>


<button onclick="pausePlay()">
⏯
</button>


<button onclick="next()">
⏭
</button>


</div>


<audio id="audio" controls></audio>


</div>





<script>


let songs=[


"Enthara-Enthara.mp3",

"Gulmohar-Malare.mp3",

"Hey Minnale.mp3",

"Kanave.mp3",

"Neeyae.mp3",

"Uyirey.mp3",

"Vaane Vaane.mp3",

"Vennilavu Saaral.mp3"


];


let index=0;


let audio=document.getElementById("audio");

let now=document.getElementById("now");



function playSong(i){


index=i;

audio.src=songs[index];

audio.play();

now.innerHTML=songs[index];


}




function next(){


index++;

if(index>=songs.length)
index=0;


playSong(index);


}




function previous(){


index--;

if(index<0)
index=songs.length-1;


playSong(index);


}



function pausePlay(){


if(audio.paused)

audio.play();

else

audio.pause();


}



</script>


</body>

</html>
